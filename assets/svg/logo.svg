<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo LumpiaMoo">
  <title>LumpiaMoo</title>
  <defs>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4B854"/>
      <stop offset="1" stop-color="#D68A26"/>
    </linearGradient>
    <mask id="bite">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="97" cy="47" r="16" fill="#000"/>
    </mask>
  </defs>

  <!-- rounded badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#C0392B"/>

  <!-- steam -->
  <g stroke="#FFF8F0" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M50 44 q7 -8 0 -16"/>
    <path d="M64 40 q7 -8 0 -16"/>
    <path d="M78 44 q7 -8 0 -16"/>
  </g>

  <!-- lumpia roll with a bite taken out -->
  <g transform="rotate(-18 64 78)" mask="url(#bite)">
    <rect x="22" y="62" width="84" height="34" rx="17" fill="url(#roll)"/>
    <path d="M40 64 v30 M56 63 v32 M72 62 v33"
          stroke="#C87F26" stroke-width="3" opacity=".55" stroke-linecap="round"/>
  </g>

  <!-- exposed beef filling -->
  <circle cx="97" cy="47" r="8.5" fill="#6B3E26"/>
</svg>
